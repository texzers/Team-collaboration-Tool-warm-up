version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: teamflow_test_postgres
    environment:
      POSTGRES_USER: teamflow_test
      POSTGRES_PASSWORD: teamflow_test_secret
      POSTGRES_DB: teamflow_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamflow_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teamflow_test_redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
